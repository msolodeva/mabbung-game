<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Arcade Clone (BnB)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-header">
        <div class="hud">
            <div class="team-stats team-red">
                <div class="team-label">🔴 레드팀</div>
                <div class="team-info">
                    <span>생존: <span id="team1-alive">3</span>/3</span>
                </div>
                <div class="player-indicator">P1: <span id="p1-status">●</span></div>
            </div>
            <div class="game-info">
                <div class="timer">TIME: <span id="game-timer">00</span></div>
            </div>
            <div class="team-stats team-blue">
                <div class="team-label">🔵 블루팀</div>
                <div class="team-info">
                    <span>생존: <span id="team2-alive">3</span>/3</span>
                </div>
                <div class="player-indicator">P2: <span id="p2-status">●</span></div>
            </div>
        </div>
    </div>
    <div id="game-container">
        <canvas id="game-canvas" width="1088" height="960"></canvas> <!-- 17x15 tiles * 64px -->
        <div id="ui-layer"></div>

        <!-- Character Selection Modal -->
        <div id="char-select-modal" class="">
            <div class="select-content">
                <h1>SELECT CHARACTER</h1>
                <div class="players-setup">
                    <div class="player-slot p1-slot">
                        <h2>PLAYER 1</h2>
                        <div class="selected-preview" id="p1-preview"></div>
                        <div class="controls-hint">WASD + F</div>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="player-slot p2-slot">
                        <h2>PLAYER 2</h2>
                        <div class="selected-preview" id="p2-preview"></div>
                        <div class="controls-hint">Arrows + R-Shift</div>
                    </div>
                </div>

                <div class="char-grid" id="char-grid">
                    <!-- Javascript will populate this -->
                </div>

                <div class="map-select-section">
                    <h2>SELECT MAP</h2>
                    <div class="map-grid" id="map-grid">
                        <!-- Javascript will populate this -->
                    </div>
                    <div id="selected-map-name" class="map-label">숲</div>
                </div>

                <div class="start-section">
                    <button id="start-game-btn" disabled>GAME START</button>
                    <div id="waiting-msg">Waiting for players...</div>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="hidden">
            <div class="modal-content">
                <h1 id="winner-text">Player 1 Wins!</h1>
                <div class="modal-buttons">
                    <button id="restart-btn">Play Again</button>
                    <button id="menu-btn" style="background-color: #3498db; margin-left: 10px;">Main Menu</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>

</html>
