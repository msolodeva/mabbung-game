<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brawl Arena - 2 Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/map-selection.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <div class="lobby-content">
                <h1 class="game-title">BRAWL ARENA</h1>
                <h2 class="mode-title">⚔️ 2 PLAYER GEM GRAB ⚔️</h2>

                <div class="player-selection-container">
                    <!-- Player 1 Selection -->
                    <div class="player-selection player1">
                        <h3 class="player-title">🔵 PLAYER 1</h3>
                        <div class="control-info"><b>WASD</b> 브롤러 선택/이동 | <b>F</b> 슈팅 | <b>G</b> 궁극기</div>
                        <div class="brawler-grid" id="player1-brawler-grid">
                            <!-- Brawlers will be added by JS -->
                        </div>
                        <div class="player-stats" id="player1-stats"></div>
                    </div>

                    <div class="vs-divider">VS</div>

                    <!-- Player 2 Selection -->
                    <div class="player-selection player2">
                        <h3 class="player-title">🔴 PLAYER 2</h3>
                        <div class="control-info"><b>방향키</b> 브롤러 선택/이동 | <b>R-Shift</b> 슈팅 | <b>Enter</b> 궁극기</div>
                        <div class="brawler-grid" id="player2-brawler-grid">
                            <!-- Brawlers will be added by JS -->
                        </div>
                        <div class="player-stats" id="player2-stats"></div>
                    </div>
                </div>

                <div class="map-selection-section">
                    <h3 class="section-title">🗺️ SELECT BATTLEGROUND</h3>
                    <div class="map-selector" id="map-selector">
                        <!-- Maps will be added by JS -->
                    </div>
                    <div class="map-info" id="map-info">
                        <div class="map-name" id="selected-map-name">Map Name</div>
                        <div class="map-desc" id="selected-map-desc">Map Description</div>
                    </div>
                </div>

                <button class="play-button" id="play-button">
                    <span>START BATTLE!</span>
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <canvas id="game-canvas"></canvas>

            <!-- HUD Overlay -->
            <div id="hud">
                <div class="team-gems">
                    <div class="gem-counter blue-team" id="blue-gems">
                        <span class="gem-icon">💎</span>
                        <span class="gem-count">0</span>
                    </div>
                    <div class="match-timer" id="match-timer">2:30</div>
                    <div class="gem-counter red-team" id="red-gems">
                        <span class="gem-count">0</span>
                        <span class="gem-icon">💎</span>
                    </div>
                </div>

                <div class="countdown-display hidden" id="countdown-display">
                    <span>TEAM WINNING IN</span>
                    <span class="countdown-time" id="countdown-time">15</span>
                </div>
            </div>

            <!-- Controls hint for 2 player -->
            <div id="controls">
                <!-- Control hints will be added by InputManager -->
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <div class="result-content">
                <h1 class="result-title" id="result-title">VICTORY</h1>
                <div class="stars-container" id="stars-container">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </div>
                <div class="result-stats" id="result-stats">
                    <!-- Stats will be added by JS -->
                </div>
                <button class="play-again-button" id="play-again-button">
                    <span>PLAY AGAIN</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js?v=3"></script>
</body>

</html>
