<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brawl Arena</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen">
            <div class="lobby-content">
                <h1 class="game-title">BRAWL ARENA</h1>
                <h2 class="mode-title">⚔️ GEM GRAB ⚔️</h2>
                
                <div class="brawler-selection">
                    <h3>SELECT YOUR BRAWLER</h3>
                    <div class="brawler-grid" id="brawler-grid">
                        <!-- Brawlers will be added by JS -->
                    </div>
                </div>
                
                <div class="selected-brawler-info" id="selected-info">
                    <div class="brawler-portrait" id="brawler-portrait"></div>
                    <div class="brawler-stats" id="brawler-stats"></div>
                </div>
                
                <button class="play-button" id="play-button">
                    <span>PLAY</span>
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <canvas id="game-canvas"></canvas>
            
            <!-- HUD Overlay -->
            <div id="hud">
                <div class="team-gems">
                    <div class="gem-counter blue-team" id="blue-gems">
                        <span class="gem-icon">💎</span>
                        <span class="gem-count">0</span>
                    </div>
                    <div class="match-timer" id="match-timer">2:30</div>
                    <div class="gem-counter red-team" id="red-gems">
                        <span class="gem-count">0</span>
                        <span class="gem-icon">💎</span>
                    </div>
                </div>
                
                <div class="countdown-display hidden" id="countdown-display">
                    <span>TEAM WINNING IN</span>
                    <span class="countdown-time" id="countdown-time">15</span>
                </div>
            </div>
            
            <!-- Controls -->
            <div id="controls">
                <div class="joystick-container left" id="move-joystick">
                    <div class="joystick-base">
                        <div class="joystick-thumb"></div>
                    </div>
                </div>
                
                <div class="joystick-container right" id="attack-joystick">
                    <div class="joystick-base attack">
                        <div class="joystick-thumb attack"></div>
                    </div>
                </div>
                
                <button class="super-button" id="super-button" disabled>
                    <div class="super-fill" id="super-fill"></div>
                    <span>SUPER</span>
                </button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <div class="result-content">
                <h1 class="result-title" id="result-title">VICTORY</h1>
                <div class="stars-container" id="stars-container">
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                    <span class="star">⭐</span>
                </div>
                <div class="result-stats" id="result-stats">
                    <!-- Stats will be added by JS -->
                </div>
                <button class="play-again-button" id="play-again-button">
                    <span>PLAY AGAIN</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
